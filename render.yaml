# Optional: Render "Blueprint" so the backend deploys with one click.
services:
  - type: web
    name: pocketsmart-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false          # you enter this in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: FLASK_SECRET_KEY
        generateValue: true  # Render generates a random one
      - key: CORS_ORIGINS
        sync: false          # e.g. https://yourname.github.io
